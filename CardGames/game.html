<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Trò chơi xếp thẻ hướng nghiệp - Sắp xếp thẻ vào các cột để khám phá bản thân">
    <meta name="keywords" content="hướng nghiệp, trắc nghiệm, thẻ bài, xếp thẻ, career game">
    <meta name="author" content="Career Card Game">
    <title>Chơi thẻ hướng nghiệp - Sắp xếp thẻ bài</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <style>
        /* Loading overlay cho game */
        .game-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .game-loading-content {
            text-align: center;
            color: white;
        }
        
        .game-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        .game-loading p {
            font-size: 18px;
            margin-top: 20px;
        }
        
        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 20px auto 0;
            overflow: hidden;
        }
        
        .loading-progress-bar {
            height: 100%;
            background: white;
            width: 0%;
            animation: progress 1.5s ease infinite;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Hướng dẫn nhanh */
        .quick-guide {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 99;
            backdrop-filter: blur(5px);
            pointer-events: none;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Nút quay lại */
        .back-home {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 99;
            backdrop-filter: blur(5px);
            text-decoration: none;
        }
        
        .back-home:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.1);
        }
        
        /* Responsive cho quick guide */
        @media (max-width: 768px) {
            .quick-guide {
                display: none;
            }
        }
        
        /* Animation cho thẻ mới xếp */
        @keyframes cardPlaced {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .compact-card {
            animation: cardPlaced 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Loading overlay -->
    <div id="game-loading" class="game-loading">
        <div class="game-loading-content">
            <div class="game-spinner"></div>
            <p>Đang tải bộ thẻ...</p>
            <div class="loading-progress">
                <div class="loading-progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Header game -->
    <header class="game-header">
        <div class="game-title">
            <h1 id="game-title">Sở thích nghề nghiệp</h1>
            <p id="game-description">Sắp xếp thẻ vào các cột phù hợp</p>
        </div>
        <div class="game-controls">
            <button id="reset-game" class="btn btn-secondary" title="Chơi lại từ đầu">
                🔄 Chơi lại
            </button>
            <button id="show-result" class="btn btn-primary" title="Xem kết quả phân tích">
                📊 Xem kết quả
            </button>
        </div>
    </header>

    <!-- Main game container -->
    <div class="game-container">
        <!-- 5 cột phân loại -->
        <div class="columns-container" id="columns-container">
            <!-- Các cột sẽ được tạo động bằng JavaScript -->
        </div>

        <!-- Sidebar bên phải -->
        <div class="game-sidebar">
            <!-- Chồng thẻ -->
            <div class="card-pile-container">
                <h3>📚 Chồng thẻ</h3>
                <div id="card-pile">
                    <div class="card back-card">
                        <div class="card-count-badge">0</div>
                    </div>
                </div>
                <p style="color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 10px;">
                    👆 Nhấn vào thẻ để chọn
                </p>
            </div>

            <!-- Chi tiết thẻ đang chọn -->
            <div class="card-detail-container">
                <h3>📖 Chi tiết thẻ</h3>
                <div id="card-detail">
                    <div class="no-card-selected">
                        👆 Nhấn vào chồng thẻ để bắt đầu
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hướng dẫn nhanh -->
    <div class="quick-guide">
        💡 Mẹo: Nhấn vào chồng thẻ → Chọn cột để xếp
    </div>

    <!-- Nút quay lại trang chủ -->
    <a href="index.html" class="back-home" title="Quay lại trang chủ">
        🏠
    </a>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cardManager.js"></script>
    <script src="js/resultRenderer.js"></script>
    <script src="js/game.js"></script>
    
    <script>
        // Ẩn loading sau khi game đã sẵn sàng
        window.addEventListener('DOMContentLoaded', function() {
            // Giả lập thời gian tải (thực tế sẽ ẩn khi data đã load xong trong game.js)
            setTimeout(function() {
                const loading = document.getElementById('game-loading');
                if (loading && typeof gameLoaded !== 'undefined' && gameLoaded) {
                    loading.style.opacity = '0';
                    setTimeout(function() {
                        loading.style.display = 'none';
                    }, 500);
                }
            }, 1500);
        });
        
        // Lưu trạng thái game đã load
        window.gameLoaded = false;
        
        // Theo dõi khi game.js hoàn tất
        document.addEventListener('gameReady', function() {
            window.gameLoaded = true;
            const loading = document.getElementById('game-loading');
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(function() {
                    loading.style.display = 'none';
                }, 500);
            }
        });
        
        // Xử lý lỗi tải dữ liệu
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('fetch')) {
                const loading = document.getElementById('game-loading');
                if (loading) {
                    loading.innerHTML = `
                        <div class="game-loading-content">
                            <div style="font-size: 48px;">⚠️</div>
                            <p style="color: #ff6b6b;">Không thể tải dữ liệu</p>
                            <p style="font-size: 14px; margin-top: 10px;">Vui lòng kiểm tra kết nối hoặc thử lại sau</p>
                            <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: white; border: none; border-radius: 8px; cursor: pointer;">
                                Thử lại
                            </button>
                            <a href="index.html" style="display: inline-block; margin-top: 10px; color: white;">← Quay lại trang chủ</a>
                        </div>
                    `;
                }
            }
        });
        
        // Thêm hiệu ứng khi kéo thả (touch events cho mobile)
        let touchStartY = 0;
        document.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', function(e) {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchEndY - touchStartY;
            // Nếu vuốt lên/xuống quá 100px, cuộn trang
            if (Math.abs(diff) > 100) {
                // Cho phép cuộn bình thường
                return;
            }
        });
        
        // Hiển thị thông báo khi rời trang
        let isGameComplete = false;
        window.addEventListener('beforeunload', function(e) {
            if (!isGameComplete && sessionStorage.getItem('gameInProgress') === 'true') {
                e.preventDefault();
                e.returnValue = 'Bạn đang chơi dở. Bạn có chắc muốn rời khỏi trang?';
                return e.returnValue;
            }
        });
        
        // Đánh dấu game đang chơi
        sessionStorage.setItem('gameInProgress', 'true');
        
        // Khi hoàn thành game, cập nhật flag
        document.addEventListener('gameCompleted', function() {
            isGameComplete = true;
            sessionStorage.removeItem('gameInProgress');
        });
    </script>
</body>
</html>
