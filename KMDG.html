<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Luận giải bộ phận - 12 con giáp theo tháng sinh âm lịch</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #fef7e0 0%, #fff3cf 100%);
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, 'Helvetica Neue', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 850px;
            width: 100%;
            background: #fffef7;
            border-radius: 64px 48px 64px 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.2s ease;
            border: 1px solid #f3d382;
        }
        .header {
            background: #a5221c;
            background-image: radial-gradient(circle at 10% 20%, #c23b2e, #831a12);
            padding: 28px 24px;
            text-align: center;
            color: #ffefb9;
            border-bottom: 6px solid #f7bc45;
        }
        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #4a0e0a;
        }
        .header p {
            margin: 12px 0 0;
            font-size: 0.95rem;
            font-style: italic;
            opacity: 0.9;
        }
        .form-container {
            display: flex;
            justify-content: center;
            padding: 28px 30px 20px;
            gap: 20px;
            background: #fff6e8;
        }
        .input-group {
            display: contents;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 28px;
        }
        .field {
            flex: 1;
            min-width: 140px;
        }
        .field label {
            display: block;
            font-weight: 700;
            color: #6b3f1c;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .field input, .field select {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #edd7ae;
            border-radius: 40px;
            background: white;
            font-weight: 500;
            transition: 0.2s;
            outline: none;
            font-family: inherit;
        }
        .field input:focus, .field select:focus {
            border-color: #c25d3a;
            box-shadow: 0 0 0 3px rgba(194, 93, 58, 0.2);
        }
        button {
            background: #d98f2b;
            border: none;
            width: 200px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #7b3e10;
            font-family: inherit;
            margin-top: 12px;
            margin-bottom: 12px;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #7b3e10;
        }
        .result-area {
            background: #fef4e2;
            margin: 12px 30px 30px 30px;
            border-radius: 48px;
            padding: 22px 24px;
            border: 1px solid #f7d99e;
            box-shadow: inset 0 1px 4px #0001, 0 6px 12px -8px rgba(0,0,0,0.2);
        }
        .result-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #a32f20;
            border-left: 7px solid #f7bc45;
            padding-left: 18px;
            margin-bottom: 18px;
        }
        .badge-year {
            background: #e4c48b;
            display: inline-block;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 18px;
            color: #3e2a1a;
        }
        .grid-parts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 10px;
        }
        .part-card {
            background: #fff6e8;
            width: 135px;
            border-radius: 60px;
            padding: 6px 18px 6px 14px;
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid #ffe1aa;
        }
        .part-name {
            font-size: 1rem;
            color: #784e22;
        }
        .part-animal {
            background: #c97e2c;
            color: white;
            border-radius: 50px;
            padding: 2px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .empty-note {
            color: #bb5e2e;
            font-style: italic;
            background: #fff0db;
            padding: 14px;
            border-radius: 32px;
            text-align: center;
        }
        .info-note {
            margin-top: 16px;
            font-size: 0.75rem;
            background: #faeecb;
            border-radius: 24px;
            padding: 10px;
            text-align: center;
            color: #7a4a1a;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 16px 24px 22px;
            color: #b97f48;
            background: #fff3e0;
            border-top: 1px solid #f7d89c;
        }
        @media (max-width: 500px) {
            .form-container { padding: 20px; }
            .result-area { margin: 12px 20px 30px; }
            .part-card { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1> BỘ PHẬN & 12 CON GIÁP </h1>
    </div>
    <div class="form-container">
        <div class="input-group">
            <div class="field">
                <label> Tháng sinh (Âm lịch)</label>
                <input type="number" id="monthInput" min="1" max="12" step="1" value="12" placeholder="1-12">
            </div>
            <div class="field">
                <label> Năm sinh (Âm lịch)</label>
                <input type="number" id="yearInput" min="1900" max="2200" step="1" value="1965" placeholder="VD: 1965">
            </div>
        </div>
        <button id="calcBtn"> XEM </button>
    </div>

    <div id="resultPanel" class="result-area">
        <div class="result-title"> Kết quả</div>
        <div id="infoYearMonth" class="badge-year">--</div>
        <div id="partListContainer">
            <div class="empty-note">🌟 Nhập tháng & năm âm lịch, nhấn nút để xem kết quả.</div>
        </div>
    </div>

</div>

<script>
    // ---------- HẰNG SỐ VÀ THỨ TỰ ----------
    // Thứ tự 12 con giáp cố định: 1 = Dần, 2 = Mẹo, 3 = Thìn, 4 = Tỵ, 5 = Ngọ, 6 = Mùi, 7 = Thân, 8 = Dậu, 9 = Tuất, 10 = Hợi, 11 = Tý, 12 = Sửu
    const ZODIAC_LIST = [
        "Dần", "Mẹo", "Thìn", "Tỵ", "Ngọ", "Mùi",
        "Thân", "Dậu", "Tuất", "Hợi", "Tý", "Sửu"
    ];
    
    // Bộ phận cố định (theo thứ tự từ Gan ... đến Răng) tổng cộng 10 bộ phận
    const BODY_PARTS = ["Gan", "Mật", "Ruột", "Mào", "Khẩu", "Mỡ", "Móng", "Sừng", "Chân", "Răng"];
    
    // Map từ tên con giáp sang thứ tự (1-12)
    const ANIMAL_TO_ORDER = {
        "Dần": 1, "Mẹo": 2, "Thìn": 3, "Tỵ": 4, "Ngọ": 5, "Mùi": 6,
        "Thân": 7, "Dậu": 8, "Tuất": 9, "Hợi": 10, "Tý": 11, "Sửu": 12
    };
    
    // Map từ thứ tự sang tên con giáp
    const ORDER_TO_ANIMAL = {
        1: "Dần", 2: "Mẹo", 3: "Thìn", 4: "Tỵ", 5: "Ngọ", 6: "Mùi",
        7: "Thân", 8: "Dậu", 9: "Tuất", 10: "Hợi", 11: "Tý", 12: "Sửu"
    };
    
    /**
     * Xác định con giáp từ năm âm lịch (hỗ trợ mọi năm, kể cả nhỏ hơn 1984)
     * Sử dụng mốc: năm 1984 là Giáp Tý (Tý)
     * Công thức: (year - 1984) mod 12, xử lý số âm đúng cách
     */
    function getAnimalByYear(lunarYear) {
        const baseYear = 1984;
        // Tính remainder đúng với số âm: ((year - baseYear) % 12 + 12) % 12
        let remainder = (lunarYear - baseYear) % 12;
        if (remainder < 0) remainder += 12;
        
        // remainder: 0 => Tý, 1 => Sửu, 2 => Dần, 3 => Mẹo, 4 => Thìn, 5 => Tỵ, 
        // 6 => Ngọ, 7 => Mùi, 8 => Thân, 9 => Dậu, 10 => Tuất, 11 => Hợi
        const mapRemainToAnimal = {
            0: "Tý", 1: "Sửu", 2: "Dần", 3: "Mẹo", 4: "Thìn", 5: "Tỵ",
            6: "Ngọ", 7: "Mùi", 8: "Thân", 9: "Dậu", 10: "Tuất", 11: "Hợi"
        };
        
        const animal = mapRemainToAnimal[remainder];
        if (!animal) {
            throw new Error(`Không xác định được con giáp cho năm ${lunarYear} (remainder=${remainder})`);
        }
        return animal;
    }
    
    // Lấy thứ tự của con giáp (1-12)
    function getOrderByAnimal(animalName) {
        return ANIMAL_TO_ORDER[animalName];
    }
    
    // Lấy tên con giáp từ thứ tự
    function getAnimalByOrder(orderNum) {
        return ORDER_TO_ANIMAL[orderNum];
    }
    
    /**
     * Hàm chính: dựa vào tháng sinh âm lịch (month: 1-12) và năm sinh âm lịch (year)
     * Trả về mảng object [{ part: "Gan", animal: "Tỵ" }, ...] theo đúng 10 bộ phận.
     */
    function computeParts(lunarMonth, lunarYear) {
        // 1. Xác định con giáp năm
        const yearAnimal = getAnimalByYear(lunarYear);
        
        // 2. Tạo mảng vòng tròn con giáp theo thứ tự
        const fullCircle = [...ZODIAC_LIST];
        
        // 3. Tính vị trí bắt đầu: tháng sinh + 1, quy về 1-12
        let startOrderNum = (lunarMonth + 1) % 12;
        if (startOrderNum === 0) startOrderNum = 12;
        
        const startAnimal = getAnimalByOrder(startOrderNum);
        let startIdx = fullCircle.indexOf(startAnimal);
        if (startIdx === -1) startIdx = 0;
        
        // 4. Tạo danh sách các con giáp hợp lệ (bỏ qua con giáp năm) lấy đủ 10 phần tử
        const availableAnimals = [];
        let currentIdx = startIdx;
        const totalNeeded = BODY_PARTS.length;
        const skippedAnimal = yearAnimal;
        let maxLoop = 0;
        
        while (availableAnimals.length < totalNeeded && maxLoop < 200) {
            const candidate = fullCircle[currentIdx % 12];
            if (candidate !== skippedAnimal) {
                availableAnimals.push(candidate);
            }
            currentIdx++;
            maxLoop++;
        }
        
        // Ghép cặp với bộ phận
        const result = [];
        for (let i = 0; i < BODY_PARTS.length; i++) {
            result.push({
                part: BODY_PARTS[i],
                animal: availableAnimals[i] || "?" // fallback an toàn
            });
        }
        return result;
    }
    
    // Hàm hiển thị kết quả ra DOM
    function renderResult(month, year) {
        const monthNum = parseInt(month, 10);
        const yearNum = parseInt(year, 10);
        
        // validation
        if (isNaN(monthNum) || monthNum < 1 || monthNum > 12) {
            document.getElementById("partListContainer").innerHTML = `<div class="empty-note">⚠️ Tháng phải từ 1 đến 12 (Âm lịch).</div>`;
            document.getElementById("infoYearMonth").innerText = `Tháng ${month} / Năm ${year} (không hợp lệ)`;
            return;
        }
        if (isNaN(yearNum) || yearNum < 1900 || yearNum > 2200) {
            document.getElementById("partListContainer").innerHTML = `<div class="empty-note">⚠️ Năm âm lịch nên từ 1900 đến 2200.</div>`;
            document.getElementById("infoYearMonth").innerText = `Tháng ${monthNum} / Năm ${yearNum} (không hợp lệ)`;
            return;
        }
        
        try {
            // Tính con giáp năm trước để kiểm tra
            const yearAnimal = getAnimalByYear(yearNum);
            const partsMapping = computeParts(monthNum, yearNum);
            const startOrderRaw = (monthNum + 1) % 12;
            const startOrder = startOrderRaw === 0 ? 12 : startOrderRaw;
            const startAnimal = getAnimalByOrder(startOrder);
            
            // Cập nhật thông tin năm tháng
            document.getElementById("infoYearMonth").innerHTML = `📅 Tháng ${monthNum} âm lịch | Năm ${yearNum} (${yearAnimal}) - Loại bỏ ${yearAnimal}`;
            
            // Tạo html danh sách bộ phận
            let html = `<div class="grid-parts">`;
            for (let item of partsMapping) {
                html += `
                    <div class="part-card">
                        <span class="part-name">${item.part}</span>
                        <span class="part-animal">${item.animal}</span>
                    </div>
                `;
            }
            html += `</div>`;
            html += `<div class="info-note">
                        ✨ Nguyên tắc: xuất phát từ tháng ${monthNum}+1 = ${startOrder} (${startAnimal}) gán cho Gan, 
                        lần lượt các bộ phận tiếp theo theo vòng tròn, bỏ qua ${yearAnimal} (con giáp năm).
                    </div>`;
            document.getElementById("partListContainer").innerHTML = html;
        } catch (err) {
            console.error(err);
            document.getElementById("partListContainer").innerHTML = `<div class="empty-note">❌ Lỗi xử lý: ${err.message}<br>Vui lòng kiểm tra lại năm sinh âm lịch.</div>`;
            document.getElementById("infoYearMonth").innerHTML = `Tháng ${monthNum} / Năm ${yearNum}`;
        }
    }
    
    // Xử lý sự kiện
    function init() {
        const btn = document.getElementById("calcBtn");
        const monthInput = document.getElementById("monthInput");
        const yearInput = document.getElementById("yearInput");
        
        const updateFromInputs = () => {
            const monthVal = monthInput.value.trim() || "12";
            const yearVal = yearInput.value.trim() || "1965";
            renderResult(monthVal, yearVal);
        };
        
        btn.addEventListener("click", updateFromInputs);
        monthInput.addEventListener("change", updateFromInputs);
        yearInput.addEventListener("change", updateFromInputs);
        
        // Hiển thị mặc định với tháng 12 năm 1965
        renderResult(12, 1965);
    }
    
    // Khởi chạy
    init();
</script>
</body>
</html>
